[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "flying-pi"
version = "0.1.0"
description = "Sequential memory in computational models using Drosophila connectome structure"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "pandas>=2,<4", "matplotlib>=3.8,<4", "mpmath>=1.3,<2", "threadpoolctl>=3,<4"]
[project.optional-dependencies]
lif = ["brian2==2.10.1", "mpmath>=1.3,<1.4"]
data = ["pyarrow>=14,<26"]
test = ["pytest>=8,<10"]
notebooks = ["jupyterlab>=4,<5"]
[project.scripts]
flying = "flying.training.train:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
